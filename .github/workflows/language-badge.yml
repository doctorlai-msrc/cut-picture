name: Update language badge

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.css'
      - '.github/workflows/language-badge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: language-badge
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Generate badge data
        run: node scripts/language-badge.mjs "$RUNNER_TEMP/javascript.json"

      - name: Publish to badges branch
        env:
          BADGE_FILE: ${{ runner.temp }}/javascript.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges; then
            git fetch origin badges:badges
            git switch badges
            git rm -rf .
          else
            git switch --orphan badges
            git rm -rf . || true
          fi
          mkdir -p .github/badges
          cp "$BADGE_FILE" .github/badges/javascript.json
          touch .nojekyll
          git add .github/badges/javascript.json .nojekyll
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update language badge"
          git push origin badges
